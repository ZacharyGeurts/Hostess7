# Field secure email — rewrite Apache from generic web to sovereign mail (AmmoNet)
# Include: sudo a2enmod proxy proxy_http rewrite ssl headers
#          sudo ln -sf /path/to/NewLatest/config/field-secure-email-apache.conf /etc/apache2/sites-available/field-secure-email.conf
#          sudo a2ensite field-secure-email && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName mail.ammonet.net
    ServerAlias mail.ammonet.com mail.ammonet.org smtp.ammonet.net imap.ammonet.net
    RewriteEngine On
    RewriteRule ^/$ /field-secure-email/status [P,L]
    RewriteRule ^/api/field-secure-email(.*)$ http://127.0.0.1:9477/api/field-secure-email$1 [P,L]
    RewriteRule ^/.*$ - [R=301,L,E=FIELD_MAIL:1]
    ErrorDocument 403 "Field secure email — human web disabled; use sovereign mail client."
</VirtualHost>

<VirtualHost *:443>
    ServerName mail.ammonet.net
    ServerAlias mail.ammonet.com mail.ammonet.org
    SSLEngine on
    # SSLCertificateFile /etc/ssl/certs/ammonet-mail.pem
    # SSLCertificateKeyFile /etc/ssl/private/ammonet-mail.key
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws/mail(.*)$ ws://127.0.0.1:9477/ws/mail$1 [P,L]
    ProxyPreserveHost On
    ProxyPass /api/field-secure-email http://127.0.0.1:9477/api/field-secure-email
    ProxyPassReverse /api/field-secure-email http://127.0.0.1:9477/api/field-secure-email
    <Location />
        Require local
    </Location>
    Header always set X-Field-Secure-Email "1"
    Header always set X-AmmoNet-Mail "sovereign"
</VirtualHost>

# SMTP submission proxy hint — field stack binds loopback; Apache documents route only
# Real SMTP/IMAP: lib/field-secure-email.py + Hostess7 gate on 127.0.0.1:587 / :993