<!DOCTYPE html>
<html lang="en" data-field-surface="eol-code" data-ammoos-os-layer="0">
<head>
  <base href="/Hostess7/" />
  <script src="/Hostess7/pages-base.js"></script>
  <script src="/Hostess7/api-shim.js"></script>
  <link rel="stylesheet" href="/Hostess7/pages-license.css" />
  <script src="/Hostess7/pages-license.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060a08" />
  <title>EOL Code — Layer 0</title>
  <link rel="stylesheet" href="/Hostess7/assets/eol-code.css?v=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:*; img-src 'self' data:; object-src 'none'; base-uri 'self'" />
</head>
<body>
  <div class="eol-root" id="eol-root">
    <header class="eol-topbar">
      <h1>EOL Code</h1>
      <p class="eol-motto">Never go down — BSP from pending (−4) through every path and dead end · Ironclad truth extends at layer 0</p>
      <div class="eol-actions">
        <button type="button" class="eol-btn" id="eol-tick">Tick</button>
        <button type="button" class="eol-btn eol-btn--run" id="eol-run">Run ×8</button>
        <button type="button" class="eol-btn" id="eol-auto">Auto</button>
        <button type="button" class="eol-btn" id="eol-refresh">Rescan</button>
        <button type="button" class="eol-btn" id="eol-reset">Reset</button>
      </div>
      <div class="eol-stats" id="eol-stats"></div>
    </header>
    <div class="eol-ruler" id="eol-ruler" aria-label="Layer ruler"></div>
    <div class="eol-main">
      <section class="eol-tree-pane" aria-label="BSP code tree">
        <div class="eol-pane-head">BSP tree · code paths · dead ends · not EOL yet</div>
        <div class="eol-tree-body rtx-smooth-scroll rtx-smooth-scroll--infinite" id="eol-tree"></div>
      </section>
      <section class="eol-wiring-pane" aria-label="Wiring audit">
        <div class="eol-pane-head">EOL registry · wiring · icons · open-file · code paths</div>
        <div class="eol-wiring-body rtx-smooth-scroll" id="eol-wiring"></div>
      </section>
      <section class="eol-log-pane" aria-label="Generator log">
        <div class="eol-pane-head">EOL Generator · Ironclad extend · live</div>
        <div class="eol-log-body rtx-smooth-scroll" id="eol-log"></div>
      </section>
    </div>
  </div>
  <script src="/Hostess7/assets/ironclad-bus.js?v=1"></script>
  <script src="/Hostess7/assets/field-rtx-smooth-scroll.js?v=1"></script>
  <script src="/Hostess7/assets/eol-code.js?v=2"></script>
  <script src="/Hostess7/pages-field-boot.js"></script>
  <script src="/Hostess7/pages-c2-wire.js"></script>
  <script src="/Hostess7/pages-queen-rtx-bridge.js"></script>
  <script src="/Hostess7/pages-ammonet-wire.js"></script>
  <script src="/Hostess7/pages-github-brain-wire.js"></script>
  <script src="/Hostess7/pages-hostess7-interaction-wire.js"></script>
</body>
</html>
