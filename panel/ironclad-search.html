<!DOCTYPE html>
<html lang="en" data-field-surface="ironclad-search" data-force-ironclad-taskbar="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ironclad Search — AmmoOS Program</title>
  <link rel="stylesheet" href="/assets/field-ironclad-taskbar.css?v=1" />
  <style>
    html, body { margin: 0; min-height: 100dvh; background: #0a0e12; color: #e8f2ea; font: 14px system-ui, sans-serif; }
    .ic-prog { padding: 20px; max-width: 960px; margin: 0 auto; }
    .ic-prog h1 { font-size: 1.25rem; margin: 0 0 8px; color: #7dd3fc; }
    .ic-prog p { color: #94a3b8; margin: 0 0 16px; }
    .fitb-root { position: static !important; max-width: 100%; }
    body.fitb-pad-bottom { padding-bottom: 0; }
  </style>
</head>
<body data-no-ironclad-taskbar="0">
  <div class="ic-prog">
    <h1>Ironclad Search</h1>
    <p>Full desktop program — registry, catalog, CHIPS, routes. Not injected into the AmmoOS taskbar.</p>
  </div>
  <div id="fitb-mount"></div>
  <script src="/assets/ironclad-bus.js?v=1"></script>
  <script src="/assets/field-ironclad-taskbar.js?v=1"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.FieldIroncladTaskbar?.mountStandalone) window.FieldIroncladTaskbar.mountStandalone();
    });
  </script>
</body>
</html>
