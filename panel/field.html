<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1814" />
  <title>AmmoOS Desktop</title>
  <meta http-equiv="refresh" content="0;url=/desktop/" />
  <script>
    (function () {
      var base = "";
      try {
        if (location.pathname.indexOf("/field") === 0) base = location.pathname.replace(/\/?field\/?$/, "") || "";
      } catch (_) {}
      location.replace((base || "") + "/desktop/" + (location.search || "") + (location.hash || ""));
    })();
  </script>
</head>
<body>
  <p><a href="/desktop/">Open AmmoOS desktop</a></p>
</body>
</html>
