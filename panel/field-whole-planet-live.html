<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-store"/>
<title>Whole planet LIVE honest · Field</title>
<style>
  :root {
    --bg:#060910; --card:#0c1218; --line:rgba(52,211,153,.3);
    --text:#e8f6f0; --muted:#8fb3a6; --em:#34d399; --sky:#38bdf8; --hot:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background:
    radial-gradient(900px 420px at 0% 0%,rgba(52,211,153,.14),transparent 55%),
    radial-gradient(700px 360px at 100% 0%,rgba(56,189,248,.1),transparent 50%),var(--bg);
    color:var(--text);min-height:100vh}
  a{color:var(--sky);text-decoration:none}a:hover{text-decoration:underline}
  header{padding:1.2rem 1.4rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(6,9,16,.92);backdrop-filter:blur(10px);z-index:2}
  h1{margin:0;font-size:1.35rem}.sub{color:var(--muted);margin-top:.35rem;font-size:.92rem;line-height:1.4}
  .pills{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.65rem}
  .pill{border:1px solid var(--line);border-radius:999px;padding:.22rem .65rem;font-size:.75rem;color:var(--muted)}
  .pill.on{color:var(--em);border-color:rgba(52,211,153,.5)}
  .pill.hot{color:var(--hot);border-color:rgba(251,191,36,.45)}
  .wrap{max-width:1100px;margin:0 auto;padding:1.1rem 1.2rem 2.5rem}
  .hero{padding:1.1rem;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,rgba(52,211,153,.12),rgba(56,189,248,.06));margin-bottom:1.1rem}
  .hero strong{color:var(--em)}
  .big{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;letter-spacing:-.02em;margin:.4rem 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.7rem}
  .card{padding:.9rem;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  .card h3{margin:0 0 .4rem;font-size:.92rem;color:var(--sky)}
  .card .v{font-size:1.08rem;font-weight:700;word-break:break-word}
  .card .d{color:var(--muted);font-size:.82rem;margin-top:.35rem;line-height:1.35}
  .links{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.5rem;margin-top:1rem}
  .links a{display:block;text-align:center;padding:.65rem .35rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:650;font-size:.86rem}
  .links a:hover{border-color:var(--em);text-decoration:none;background:#12201b}
  .motto{margin-top:1rem;padding:.85rem;border-left:3px solid var(--em);background:rgba(52,211,153,.06);color:var(--muted);font-size:.9rem;line-height:1.45}
  footer{margin-top:1.5rem;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<header>
  <h1>Whole planet LIVE honest</h1>
  <div class="sub" id="hdr">Live online matches the whole planet for real · straight away</div>
  <div class="pills" id="pills"></div>
</header>
<div class="wrap">
  <div class="hero">
    <div><strong>For real.</strong> Live honest is no longer a local sample. It is the whole planet device plane on Field.</div>
    <div class="big" id="big">—</div>
    <div class="links" id="quick"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="motto" id="motto">loading…</div>
  <footer id="foot">Field · whole planet live</footer>
</div>
<script>
(async function(){
  document.getElementById("quick").innerHTML = [
    ["/","Hub"],["/celebrate","Celebrate"],["/botnet","Botnet"],
    ["/planetary-rescue","Rescue"],["/world-ip-lease","IP+lease"],
    ["/full-internet","Full Internet"],["/sitrep","Sitrep"],
  ].map(([h,t])=>`<a href="${h}">${t}</a>`).join("");
  let d={};
  try {
    const r = await fetch("/api/field-whole-planet-live", {cache:"no-store"});
    d = await r.json();
  } catch(_) {
    try {
      const r2 = await fetch("/api/everyone-online/slim", {cache:"no-store"});
      d = await r2.json();
    } catch(__) {}
  }
  const fmt = (n) => (typeof n === "number" ? n.toLocaleString() : (n ?? "—"));
  const live = d.live_online_honest ?? d.everyone_online_live ?? "—";
  document.getElementById("big").textContent = fmt(live) + " LIVE honest";
  const cards = [
    {h:"Live honest", v: fmt(d.live_online_honest), d:"Whole planet devices on Field for real"},
    {h:"Everyone online live", v: fmt(d.everyone_online_live), d:"Celebrate / hub headcount"},
    {h:"Matches planet", v: d.matches_planet||d.whole_planet_live?"YES":"—", d:"Live = planet_everyone_devices"},
    {h:"Population", v: fmt(d.planet_everyone_population), d:"Earth census people (reference)"},
    {h:"Serving capacity", v: fmt(d.serving_devices), d:"Trillions authority plane"},
    {h:"Local sample", v: fmt(d.local_inventory_sample), d:"Inventory rows only — not ceiling"},
    {h:"Sealed", v: d.sealed||d.whole_planet_live?"YES":"—", d:"Straight away · for real"},
    {h:"Fleet", v: fmt(d.fleet), d:"Registry fleet edges"},
  ];
  document.getElementById("grid").innerHTML = cards.map(c=>`
    <div class="card"><h3>${c.h}</h3><div class="v">${c.v}</div><div class="d">${c.d}</div></div>
  `).join("");
  document.getElementById("motto").textContent = d.motto || d.people_vs_sample || "Whole planet live loading…";
  document.getElementById("hdr").textContent = (d.updated||"") + " · " + (d.title||"Whole planet LIVE honest");
  document.getElementById("pills").innerHTML = [
    d.whole_planet_live&&"whole planet live",
    d.for_real&&"for real",
    d.straight_away&&"straight away",
    d.sealed&&"sealed",
    d.matches_planet&&"matches planet",
  ].filter(Boolean).map((t,i)=>`<span class="pill ${i<2?'on':'hot'}">${t}</span>`).join("");
  document.getElementById("foot").textContent =
    "API " + (d.api||"/api/field-whole-planet-live") + " · " + (location.origin||"") + "/whole-planet-live";
})();
</script>
</body>
</html>
