<!DOCTYPE html>
<html lang="en" data-field-surface="broadcaster-launcher">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Broadcaster</title>
  <meta name="description" content="AmmoOS Broadcaster — OBS Studio rebuilt from source. Native shell only." />
  <link rel="icon" href="/assets/queen-prog-broadcaster.png" type="image/png" />
  <link rel="stylesheet" href="/assets/field-broadcaster.css?v=7" />
</head>
<body class="bc-launcher-body">
  <main class="bc-launcher" id="bc-launcher">
    <img class="bc-launcher-icon" src="/assets/queen-prog-broadcaster.png" alt="" width="64" height="64" />
    <h1 class="bc-launcher-title">Broadcaster</h1>
  <p class="bc-launcher-sub">OBS Studio rebuilt from source · verbatim interface · Broadcaster for AmmoOS</p>
  <p class="bc-launcher-status" id="bc-status">Starting Broadcaster…</p>
  <div class="bc-launcher-actions">
      <button type="button" class="bc-launcher-btn bc-launcher-btn--primary" id="bc-launch">Open Broadcaster</button>
      <button type="button" class="bc-launcher-btn" id="bc-record">Record</button>
      <button type="button" class="bc-launcher-btn" id="bc-studio">Studio Mode</button>
      <button type="button" class="bc-launcher-btn" id="bc-build">Prepare source build</button>
    </div>
    <dl class="bc-launcher-meta" id="bc-meta"></dl>
    <p class="bc-launcher-hint" id="bc-hint" hidden></p>
  </main>
  <script src="/assets/field-broadcaster.js?v=7" defer></script>
</body>
</html>
