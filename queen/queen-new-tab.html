<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/Hostess7/pages-base.js"></script>
  <script src="/Hostess7/api-shim.js"></script>
  <script src="/Hostess7/pages-queen-hardening.js"></script>
  <link rel="stylesheet" href="/Hostess7/pages-deploy-everyone.css" />
  <script src="/Hostess7/pages-deploy-everyone.js"></script>
  <link rel="stylesheet" href="/Hostess7/pages-license.css" />
  <script src="/Hostess7/pages-license.js"></script>
  <base href="/Hostess7/queen/" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Queen Browser</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0a0806;
      color: #e6efe0;
      font: 14px/1.5 system-ui, sans-serif;
    }
    .qnt {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      background:
        radial-gradient(ellipse 70% 50% at 88% 6%, rgba(219, 112, 147, 0.08), transparent 55%),
        radial-gradient(ellipse 80% 55% at 8% 94%, rgba(120, 72, 48, 0.12), transparent 50%),
        #0a0806;
    }
    .qnt h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #5ecf7a;
    }
    .qnt p {
      margin: 0;
      color: #b8957a;
      font-size: 0.9rem;
    }
    .qnt form {
      width: min(560px, 92vw);
      display: flex;
      gap: 8px;
    }
    .qnt input {
      flex: 1 1 auto;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid rgba(120, 72, 48, 0.55);
      background: #060806;
      color: #e6efe0;
      font: inherit;
      outline: none;
    }
    .qnt input:focus {
      border-color: rgba(94, 207, 122, 0.55);
      box-shadow: 0 0 0 2px rgba(94, 207, 122, 0.15);
    }
    .qnt button {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(120, 72, 48, 0.55);
      background: rgba(20, 16, 12, 0.9);
      color: #f472b6;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .qnt button:hover { color: #5ecf7a; border-color: rgba(94, 207, 122, 0.45); }
    .qnt-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      justify-content: center;
      margin-top: 8px;
    }
    .qnt-links a {
      color: #c4b896;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .qnt-links a:hover { color: #5ecf7a; }
  </style>
</head>
<body>
  <main class="qnt">
    <h1>Queen Browser</h1>
    <p>Search or enter an address</p>
    <form id="qnt-go">
      <input type="search" id="qnt-url" placeholder="https://… or search terms" spellcheck="false" autofocus />
      <button type="submit">Go</button>
    </form>
    <nav class="qnt-links" aria-label="Quick links">
      <a href="about:blank">New tab</a>
    </nav>
  </main>
  <script>
    (function () {
      var form = document.getElementById("qnt-go");
      var input = document.getElementById("qnt-url");
      function toUrl(raw) {
        var q = String(raw || "").trim();
        if (!q) return "";
        if (/^https?:\/\//i.test(q)) return q;
        if (/^[\w.-]+\.[a-z]{2,}/i.test(q) && !q.includes(" ")) return "https://" + q;
        return "https://duckduckgo.com/?q=" + encodeURIComponent(q);
      }
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var url = toUrl(input.value);
        if (url) window.location.href = url;
      });
    })();
  </script>
</body>
</html>
