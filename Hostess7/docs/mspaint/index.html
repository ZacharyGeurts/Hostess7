<!DOCTYPE html>
<html lang="en" data-field-surface="mspaint" data-ammoos-os-layer="0" data-clipboard-wire="nexus" data-nexus-clipboard-sovereign="1">
<head>
  <base href="/Hostess7/" />
  <script src="/Hostess7/pages-base.js"></script>
  <script src="/Hostess7/api-shim.js"></script>
  <link rel="stylesheet" href="/Hostess7/pages-license.css" />
  <script src="/Hostess7/pages-license.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c0c0c0" />
  <title>MSPaint</title>
  <link rel="stylesheet" href="/Hostess7/assets/mspaint.css?v=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:*; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'" />
</head>
<body>
  <div class="msp-root" id="msp-root">
    <header class="msp-menubar" role="menubar" aria-label="MSPaint menu">
      <button type="button" class="msp-menu-btn" data-menu="file">File</button>
      <button type="button" class="msp-menu-btn" data-menu="edit">Edit</button>
      <button type="button" class="msp-menu-btn" data-menu="view">View</button>
      <button type="button" class="msp-menu-btn" data-menu="image">Image</button>
      <button type="button" class="msp-menu-btn" data-menu="colors">Colors</button>
      <button type="button" class="msp-menu-btn" data-menu="help">Help</button>
      <span class="msp-title">MSPaint — MS-DOS 4.0 · GNU module</span>
      <span class="msp-sovereign" id="msp-sovereign" title="Sovereign time witness">…</span>
    </header>
    <div class="msp-toolbar" role="toolbar" aria-label="Tools">
      <button type="button" class="msp-tool msp-tool--active" data-tool="pencil" title="Pencil">✎</button>
      <button type="button" class="msp-tool" data-tool="brush" title="Brush">🖌</button>
      <button type="button" class="msp-tool" data-tool="eraser" title="Eraser">⌫</button>
      <button type="button" class="msp-tool" data-tool="fill" title="Fill">▣</button>
      <button type="button" class="msp-tool" data-tool="line" title="Line">╱</button>
      <button type="button" class="msp-tool" data-tool="rect" title="Rectangle">▭</button>
      <button type="button" class="msp-tool" data-tool="ellipse" title="Ellipse">◯</button>
      <button type="button" class="msp-tool" data-tool="pick" title="Pick color">◎</button>
      <label class="msp-size"><span>Size</span><input type="range" id="msp-brush-size" min="1" max="24" value="2" /></label>
    </div>
    <div class="msp-workspace">
      <aside class="msp-palette" aria-label="Colors">
        <div class="msp-pal-grid" id="msp-palette"></div>
        <div class="msp-pal-custom">
          <label>Foreground<input type="color" id="msp-fg" value="#000000" /></label>
          <label>Background<input type="color" id="msp-bg" value="#ffffff" /></label>
        </div>
      </aside>
      <div class="msp-canvas-wrap">
        <canvas id="msp-canvas" width="640" height="480" aria-label="Drawing canvas"></canvas>
      </div>
    </div>
    <footer class="msp-status" id="msp-status">Ready · Ctrl+V paste · clipboard wire</footer>
  </div>
  <div class="msp-dropdown" id="msp-dropdown" hidden></div>
  <script src="/Hostess7/assets/field-sovereign-bus.js?v=1"></script>
  <script src="/Hostess7/assets/clipboard-wire.js?v=5"></script>
  <script src="/Hostess7/assets/mspaint.js?v=1"></script>
  <script src="/Hostess7/pages-field-boot.js"></script>
  <script src="/Hostess7/pages-c2-wire.js"></script>
  <script src="/Hostess7/pages-queen-rtx-bridge.js"></script>
  <script src="/Hostess7/pages-ammonet-wire.js"></script>
  <script src="/Hostess7/pages-github-brain-wire.js"></script>
  <script src="/Hostess7/pages-hostess7-interaction-wire.js"></script>
</body>
</html>
