<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/Hostess7/pages-base.js"></script>
  <script src="/Hostess7/api-shim.js"></script>
  <script src="/Hostess7/pages-queen-hardening.js"></script>
  <link rel="stylesheet" href="/Hostess7/pages-deploy-everyone.css" />
  <script src="/Hostess7/pages-deploy-everyone.js"></script>
  <link rel="stylesheet" href="/Hostess7/pages-license.css" />
  <script src="/Hostess7/pages-license.js"></script>
  <base href="/Hostess7/queen/" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AmmoOS Terminal</title>
  <link rel="stylesheet" href="queen-styles.css" data-queen-theme="1" />
  <link rel="stylesheet" href="queen-gnu-terminal.css" data-queen-theme="1" />
  <link rel="stylesheet" href="kilroy-universal-terminal.css" data-queen-theme="1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:*; frame-src 'self' https:; img-src 'self' data:; object-src 'none'; base-uri 'self'" />
  <style>
    html, body { margin: 0; height: 100%; background: #030806; }
    #qgt-embed-root { height: 100%; min-height: 320px; }
  </style>
</head>
<body>
  <div id="qgt-embed-root"></div>
  <script src="queen-styles.js" data-queen-theme="1"></script>
  <script src="kilroy-universal-shell.js"></script>
  <script src="queen-gnu-terminal.js"></script>
  <script src="kilroy-universal-terminal.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(location.search);
      const cwd = params.get("cwd") || "";
      void globalThis.KilroyUniversalTerminal?.mount(document.getElementById("qgt-embed-root"), { cwd })?.then(() => {
        if (cwd) return globalThis.KilroyUniversalTerminal?.exec?.(`cd ${cwd.replace(/"/g, '\\"')}`);
      });
    });
  </script>
</body>
</html>
