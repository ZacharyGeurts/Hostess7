<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/Hostess7/" />
  <script src="/Hostess7/pages-base.js"></script>
  <script src="/Hostess7/api-shim.js"></script>
  <link rel="stylesheet" href="/Hostess7/pages-license.css" />
  <script src="/Hostess7/pages-license.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AmmoOS Calculator</title>
  <link rel="icon" href="/Hostess7/assets/queen-prog-field-48.png" type="image/png" />
  <style>
    :root {
      --bg: #0a0e12;
      --panel: #111820;
      --accent: #22c55e;
      --rose: #f472b6;
      --text: #e8f2ea;
      --dim: #8a9aaa;
      --line: #243040;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 30% 0%, #0f1a14 0%, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header span { color: var(--dim); font-size: 0.78rem; font-weight: 400; }
    main {
      flex: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      padding: 16px;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
    }
    #expr {
      width: 100%;
      padding: 14px;
      font-size: 1.25rem;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
    }
    #result {
      min-height: 2.5rem;
      font-size: 1.15rem;
      color: var(--accent);
      word-break: break-all;
    }
    .pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .pad button {
      padding: 14px 0;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
    }
    .pad button:hover { border-color: var(--accent); background: #141c24; }
    .pad button.op { color: var(--rose); }
    .pad button.wide { grid-column: span 2; }
    .hint { font-size: 0.75rem; color: var(--dim); text-align: center; }
  </style>
</head>
<body>
  <header>AmmoOS Calculator <span>Hostess 7</span></header>
  <main>
    <input id="expr" type="text" placeholder="2+2 · sqrt(144) · 15%" autocomplete="off" />
    <div id="result">—</div>
    <div class="pad" id="pad"></div>
    <p class="hint">Pages bench + loopback perfect calculator</p>
  </main>
  <script>
    const expr = document.getElementById("expr");
    const result = document.getElementById("result");
    const keys = ["7","8","9","/","4","5","6","*","1","2","3","-","0",".","=","+","(",")","^","C"];
    const pad = document.getElementById("pad");
    keys.forEach(function (k) {
      const b = document.createElement("button");
      b.textContent = k;
      if ("+-*/^=()".includes(k)) b.className = "op";
      if (k === "C") b.className = "wide";
      b.addEventListener("click", function () {
        if (k === "C") { expr.value = ""; result.textContent = "—"; return; }
        if (k === "=") { compute(); return; }
        expr.value += k;
        expr.focus();
      });
      pad.appendChild(b);
    });

    function apiUrl(path) {
      if (window.H7Base) return window.H7Base(path);
      return path;
    }

    function localEval(q) {
      let s = String(q || "").trim();
      if (!s) return null;
      if (s.endsWith("%")) {
        const n = parseFloat(s.slice(0, -1));
        if (!isNaN(n)) return n / 100;
      }
      s = s.replace(/%/g, "/100").replace(/\^/g, "**").replace(/sqrt\(/gi, "Math.sqrt(");
      if (!/^[\d\s+\-*/().e%a-z]+$/i.test(s)) throw new Error("unsafe expression");
      const val = Function('"use strict"; return (' + s + ")")();
      if (typeof val !== "number" || !isFinite(val)) throw new Error("not a number");
      return val;
    }

    async function compute() {
      const q = expr.value.trim();
      if (!q) return;
      result.textContent = "…";
      try {
        const res = await fetch(apiUrl("/api/hostess7/calculator/compute"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: q }),
        });
        if (res.ok) {
          const doc = await res.json();
          const out = doc.result ?? doc.answer ?? doc.value;
          if (out != null) {
            result.textContent = String(out);
            return;
          }
        }
      } catch (_e) { /* pages fallback */ }
      try {
        result.textContent = String(localEval(q));
      } catch (e) {
        result.textContent = "Error: " + e.message;
      }
    }
    expr.addEventListener("keydown", function (e) { if (e.key === "Enter") compute(); });
  </script>
  <script src="/Hostess7/pages-field-boot.js"></script>
  <script src="/Hostess7/pages-c2-wire.js"></script>
  <script src="/Hostess7/pages-queen-rtx-bridge.js"></script>
  <script src="/Hostess7/pages-ammonet-wire.js"></script>
  <script src="/Hostess7/pages-github-brain-wire.js"></script>
  <script src="/Hostess7/pages-hostess7-interaction-wire.js"></script>
</body>
</html>
