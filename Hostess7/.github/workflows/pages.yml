name: Hostess7 GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "Hostess7/docs/**"
      - "Hostess7/data/**"
      - "Hostess7/scripts/hostess7_pages_*.py"
      - "lib/hostess7-x-comments.py"
      - "lib/hostess7-censorship-exposure.py"
      - "Hostess7/.github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hostess7-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps (no editable — version 2.0.7h is not PEP440)
        run: pip install -r requirements.txt

      - name: Build Pages package
        working-directory: Hostess7
        env:
          HOSTESS7_ROOT: ${{ github.workspace }}/Hostess7
          NEXUS_INSTALL_ROOT: ${{ github.workspace }}
          HOSTESS7_LICENSE_MODE: war
          HOSTESS7_WAR_PROFILE: "1"
          NEXUS_PRESUME_HOSTILE: "1"
        run: |
          python scripts/hostess7_pages_surfaces_build.py
          python scripts/hostess7_pages_brain_build.py --lite
          python scripts/hostess7_pages_api_export.py

      - name: Presume hostile — deploy integrity guard
        working-directory: Hostess7
        run: python scripts/hostess7-pages-deploy-guard.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Hostess7/docs

      - id: deployment
        uses: actions/deploy-pages@v4