name: Hostess7 GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "data/**"
      - "scripts/hostess7_pages_*.py"
      - "scripts/publish-hostess7-pages.sh"
      - "scripts/hostess7-pages-deploy-guard.py"
      - "src/hostess7/**"
      - "zac/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hostess7-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps (no editable — version 2.0.7h is not PEP440)
        run: pip install -r requirements.txt

      - name: Build full Pages package
        env:
          HOSTESS7_ROOT: ${{ github.workspace }}
          HOSTESS7_LICENSE_MODE: war
          HOSTESS7_WAR_PROFILE: "1"
          NEXUS_PRESUME_HOSTILE: "1"
        run: |
          python scripts/hostess7_pages_surfaces_build.py
          python scripts/hostess7_pages_brain_build.py --full
          python scripts/hostess7_pages_api_export.py

      - name: Presume hostile — deploy integrity guard
        run: python scripts/hostess7-pages-deploy-guard.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4